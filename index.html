<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container my-4 text-end">

        <div class="p-4 shadow-lg rounded bg-white mb-4 border-top border-primary border-5">
            <h2 class="text-center mb-4 text-primary fw-bold"> بوابة الطالب البديلة- كلية الطيران المدني مصراتة</h2>
            <div class="row g-3 justify-content-center">
                <div class="col-md-6">
                    <input type="text" id="studentIdInput" class="form-control form-control-lg border-primary shadow-sm"
                        placeholder="أدخل الرقم الوطني لرؤية بياناتك...">
                </div>
                <div class="col-md-3">
                    <button onclick="searchStudent()" class="btn btn-primary btn-lg w-100 shadow-sm">🔍 عرض البيانات</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden">
            <div id="studentNameHeader" class="alert alert-info shadow-sm text-center fw-bold mb-4 border-0"></div>

            <ul class="nav nav-pills nav-fill mb-3 shadow-sm p-2 bg-white rounded" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link active fw-bold" data-bs-toggle="pill"
                        data-bs-target="#pills-seating" type="button">🪑 جداول الجلوس</button></li>
                <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="pill"
                        data-bs-target="#pills-grades" type="button">📊 تفاصيل الدرجات</button></li>
            </ul>

            <div class="tab-content card shadow-lg border-0 mb-5">
                <div class="tab-pane fade show active" id="pills-seating" role="tabpanel">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>المقرر</th>
                                    <th>تاريخ الامتحان</th>
                                    <th>موقع الجلوس (القاعة والكرسي)</th>
                                </tr>
                            </thead>
                            <tbody id="seatingBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="tab-pane fade" id="pills-grades" role="tabpanel">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 text-center align-middle">
                            <thead class="table-primary">
                                <tr>
                                    <th>المقرر</th>
                                    <th>أعمال العملي (Lab)</th>
                                    <th>أعمال النظري (Theo)</th>
                                    <th>مجموع الأعمال (Total)</th>
                                </tr>
                            </thead>
                            <tbody id="gradesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="errorArea"
            class="alert alert-warning text-center shadow-sm rounded-4 animate__animated animate__shakeX hidden">
            ⚠️ عذراً، لم يتم العثور على بيانات لهذا الرقم الوطني.
        </div>
    </div>

    <script>
        let csvData = [];

        // 1. تحميل ملف الـ CSV تلقائياً عند فتح الصفحة
        window.onload = function () {
            Papa.parse("data.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                // تحويل أسماء الأعمدة إلى أحرف صغيرة وإزالة أي فراغات زائدة لضمان المطابقة الكاملة
                transformHeader: function(h) {
                    return h.trim().toLowerCase();
                },
                complete: function (results) {
                    csvData = results.data;
                    console.log("Data Loaded successfully.", csvData);
                },
                error: function(err) {
                    console.error("Error loading CSV file:", err);
                }
            });
        };

        function searchStudent() {
            const inputId = document.getElementById('studentIdInput').value.trim();
            
            if (!inputId) {
                alert("الرجاء إدخال الرقم الوطني أولاً");
                return;
            }

            // الفلترة الآمنة بغض النظر عن الفراغات المخفية في السجلات
            const results = csvData.filter(row => {
                const sId = row["studentid"] || row["studentId"];
                return sId && sId.toString().trim() === inputId;
            });

            if (results.length > 0) {
                document.getElementById('errorArea').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
                
                // جلب اسم الطالب بأمان
                const studentName = results[0]["studentname"] || results[0]["studentName"] || "غير معروف";
                document.getElementById('studentNameHeader').innerText = "👤 الطالب: " + studentName;

                let seatingHtml = '';
                let gradesHtml = '';

                results.forEach(row => {
                    // استخراج القيم مع دعم الحالات المختلفة للأحرف وحمايتها من قيم الـ undefined
                    const course = row["course"] || "—";
                    const examDate = row["exam_date"] || row["examdate"] || "—";
                    const hallAndSeat = row["hallandseat"] || "—";
                    const lab = row["lab"] || "—";
                    const theo = row["theo"] || "—";
                    const total = row["total"] || "—";

                    // إضافة السطر لجدول الجلوس
                    seatingHtml += `<tr>
                        <td class="fw-bold">${course}</td>
                        <td class="text-danger fw-bold">${examDate}</td>
                        <td><span class="badge bg-warning text-dark fs-6">${hallAndSeat}</span></td>
                    </tr>`;

                    // إضافة السطر لجدول الدرجات
                    gradesHtml += `<tr>
                        <td class="fw-bold">${course}</td>
                        <td>${lab}</td>
                        <td>${theo}</td>
                        <td class="table-success fw-bold">${total}</td>
                    </tr>`;
                });

                document.getElementById('seatingBody').innerHTML = seatingHtml;
                document.getElementById('gradesBody').innerHTML = gradesHtml;
            } else {
                document.getElementById('resultArea').classList.add('hidden');
                document.getElementById('errorArea').classList.remove('hidden');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
